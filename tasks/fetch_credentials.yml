---
# tasks/fetch_credentials.yml
# Discovers the _credential variable on the target endpoint's host vars,
# resolves it against the AWX credentials API, and attaches it to the
# currently running job template.
# Any failure is caught in the rescue block, which writes error_code and
# error_message into the AWX job Artifacts before re-raising the failure.

- name: Fetch and attach endpoint credential
  block:

    # ── Step 1: Discover credential variable keys ──────────────────────────

    - name: Build list of host variable keys ending with '{{ credential_variable_suffix }}'
      ansible.builtin.set_fact:
        _credential_var_keys: >-
          {{
            hostvars[inventory_host].keys()
            | select('match', '.*' + credential_variable_suffix + '$')
            | list
          }}

    # ── Step 2: Enforce exactly one credential variable ────────────────────

    - name: Fail if no credential variable is found on host '{{ inventory_host }}'
      ansible.builtin.fail:
        msg: >-
          No host variable ending with '{{ credential_variable_suffix }}' was found
          in the host variables of '{{ inventory_host }}'.
          Add a variable such as 'my_app_credential: <AWX credential name>'
          to the host or group variables for this host in the AWX inventory.
      when: _credential_var_keys | length == 0

    - name: Fail if multiple credential variables are found on host '{{ inventory_host }}'
      ansible.builtin.fail:
        msg: >-
          Multiple host variables ending with '{{ credential_variable_suffix }}' were found
          on '{{ inventory_host }}': {{ _credential_var_keys | join(', ') }}.
          Exactly one is required. Remove the extra variable(s) from the host/group vars.
      when: _credential_var_keys | length > 1

    # ── Step 3: Extract the credential name value ──────────────────────────

    - name: Set fact — credential name from host variable '{{ _credential_var_keys[0] }}'
      ansible.builtin.set_fact:
        _endpoint_credential_name: "{{ hostvars[inventory_host][_credential_var_keys[0]] }}"

    - name: Validate the credential name value is non-empty
      ansible.builtin.assert:
        that:
          - _endpoint_credential_name is defined
          - _endpoint_credential_name | length > 0
        fail_msg: >-
          The host variable '{{ _credential_var_keys[0] }}' on '{{ inventory_host }}'
          is defined but has an empty value. Set it to a valid AWX credential name.

    # ── Step 4: Look up the credential in AWX ─────────────────────────────

    - name: Look up AWX credential by name '{{ _endpoint_credential_name }}'
      ansible.builtin.uri:
        url: "{{ awx_host }}/api/v2/credentials/?name={{ _endpoint_credential_name | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ awx_token }}"
          Content-Type: "application/json"
        validate_certs: "{{ awx_validate_certs }}"
        return_content: true
        status_code: 200
      register: _awx_credential_lookup
      no_log: false

    - name: Fail if credential '{{ _endpoint_credential_name }}' is not found in AWX
      ansible.builtin.fail:
        msg: >-
          The AWX credential named '{{ _endpoint_credential_name }}' was not found.
          Ensure the credential exists in AWX and that the name matches exactly
          (names are case-sensitive).
      when: _awx_credential_lookup.json.count == 0

    - name: Set fact — AWX credential ID for '{{ _endpoint_credential_name }}'
      ansible.builtin.set_fact:
        _awx_credential_id: "{{ _awx_credential_lookup.json.results[0].id }}"
      no_log: false

    # ── Step 5: Detect the currently running job template ID ───────────────

    - name: Read awx_job_template_id from AWX magic variables
      ansible.builtin.set_fact:
        _awx_job_template_id: "{{ awx_job_template_id | default('') }}"

    - name: Fail if awx_job_template_id magic variable is not set
      ansible.builtin.fail:
        msg: >-
          The AWX magic variable 'awx_job_template_id' is not set or is empty.
          This variable is automatically injected by AWX when a job runs.
          Ensure this role is executed as part of an AWX job template.
      when: _awx_job_template_id | string | length == 0

    # ── Step 6: Attach the credential to the job template ─────────────────

    - name: Attach credential '{{ _endpoint_credential_name }}' to job template {{ _awx_job_template_id }}
      ansible.builtin.uri:
        url: "{{ awx_host }}/api/v2/job_templates/{{ _awx_job_template_id }}/credentials/"
        method: POST
        headers:
          Authorization: "Bearer {{ awx_token }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ {'id': _awx_credential_id | int} }}"
        validate_certs: "{{ awx_validate_certs }}"
        status_code: 204
      no_log: false
      register: _awx_attach_result

    - name: Confirm credential was successfully attached
      ansible.builtin.debug:
        msg: >-
          Successfully attached AWX credential '{{ _endpoint_credential_name }}'
          (id: {{ _awx_credential_id }}) to job template {{ _awx_job_template_id }}.

  # ── Error handler: populate AWX job Artifacts then re-raise ───────────────
  rescue:
    - name: Write error details to AWX job Artifacts
      ansible.builtin.set_stats:
        data:
          error_code: "{{ ansible_failed_result.status | default('TASK_FAILURE') | string }}"
          error_message: "{{ ansible_failed_result.msg | default(ansible_failed_result | string) }}"
          failed_task: "{{ ansible_failed_task.name }}"
        aggregate: false

    - name: Re-raise the original failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default(ansible_failed_result | string) }}"
